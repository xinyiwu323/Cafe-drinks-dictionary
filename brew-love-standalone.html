<script>
// ---- everything below positions Xinyi's Figma frames (1440x900) exactly ----
const W=1440,H=900, HOT=6.6;           // arrow tip inside her cursor group
// ---- the dictionary: the drinks on her wheel + Sicily (her survey). Anything typed in is added for everyone. ----
const BUILTIN=[ // name, ingredients (base first), her one-word taste note, where the name comes from
 ['Cafe Touba',['Ground coffee','Grains of selim','Sugar'],'spicy','Named after Touba, a holy city in Senegal.'],
 ['Kopi Joss',['Black coffee','Hot charcoal','Sugar'],'smoky','From Yogyakarta, Indonesia: a burning coal is dropped into the cup.'],
 ['Kaffeost',['Black coffee','Cheese curds'],'creamy','From Lapland: squeaky cheese curds soaked in hot coffee.'],
 ['Barraquito',['Espresso','Condensed milk','Licor 43','Lemon peel'],'boozy','A layered coffee from Tenerife in the Canary Islands.'],
 ['Leche y Leche',['Espresso','Condensed milk','Milk foam'],'sweet','Canary Islands. It means milk and milk.'],
 ['Carajillo',['Espresso','Licor 43','Ice'],'boozy','Spain and Mexico: coffee with a shot of liqueur.'],
 ['Bombon',['Espresso','Condensed milk'],'sweet','Valencia, Spain. Named after a bonbon, the sweet.'],
 ['Mazagran',['Cold coffee','Sugar','Lemon'],'citrusy','Said to be named after a fort in Algeria.'],
 ['Guayoyo',['Coffee','Hot water','Sugar'],'light','Venezuela: a long, mild coffee.'],
 ['Tinto',['Black coffee','Panela'],'bold','Colombia. Tinto means dyed, for its dark colour.'],
 ['Cafezinho',['Coffee','Sugar'],'sweet','Brazil. It means little coffee.'],
 ['Cafe de Olla',['Coffee','Piloncillo','Cinnamon'],'spiced','Mexico. Brewed in a clay pot, an olla.'],
 ['Cortadito',['Espresso','Sugar','Steamed milk'],'sweet','Cuba. Espresso cut with a little milk.'],
 ['Bica',['Espresso','Sugar'],'bold','What Lisbon calls an espresso.'],
 ['Bicerin',['Espresso','Drinking chocolate','Cream'],'chocolatey','Turin, Italy. It means small glass.'],
 ['Shakerato',['Espresso','Ice','Sugar'],'frothy','Italy. Espresso shaken with ice until it foams.'],
 ['Einspanner',['Coffee','Whipped cream','Powdered sugar'],'creamy','Vienna. Named after one-horse carriages.'],
 ['Pharisaer',['Coffee','Rum','Whipped cream'],'boozy','North Germany. The cream hides the rum.'],
 ['Cafe Brulot',['Coffee','Brandy','Orange peel'],'flaming','New Orleans. Flamed with brandy at the table.'],
 ['Kopi Tubruk',['Coarse coffee','Hot water','Sugar'],'earthy','Java, Indonesia. The grounds stay in the cup.'],
 ['Kopi Talua',['Coffee','Egg yolk','Condensed milk'],'eggy','West Sumatra. Talua means egg.'],
 ['Kopi Siew Dai',['Coffee','Condensed milk'],'mellow','Malaysia and Singapore. Siew dai means less sweet.'],
 ['Sicily',['Cold brew','Raw sugar','Lemon juice','Orange blossom','Lime zest'],'citrusy','Named after the island. 0 of 9 people guessed citrus.'],
];
// three behaviours only: a SWEET ingredient is shaken in (her sugar), a BRIGHT one is drawn in as drops (her lemon),
// everything else rides in the pour. How much of each = how strong that ingredient is.
const SWEET={'condensed milk':3,'brown sugar syrup':3,'syrup':2,'raw sugar':2,'powdered sugar':1,'sugar':2,'panela':2,'piloncillo':2,'honey':2,'drinking chocolate':2,'chocolate':2,'licor 43':1,'agave':1};
const BRIGHT={'lemon juice':3,'lemon peel':1,'lemon':3,'lime zest':1,'lime':2,'orange blossom':2,'orange peel':2,'orange':2,'yuzu':3,'tonic':2,'rose':1};
const look=(dict,s)=>{ s=s.toLowerCase(); let best=null; for(const k in dict) if(s.includes(k)&&(!best||k.length>best.length)) best=k; return best?dict[best]:0; };
const norm=s=>String(s).normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-zA-Z0-9 ]/g,'').trim().toLowerCase().replace(/\s+/g,' ');
function mk(d){ const roles=d.roles||[]; let sweet=0,bright=0,sweetIdx=-1,brightIdx=-1;
  d.ings.forEach((ing,k)=>{ if(k===0) return;
    const ws=look(SWEET,ing)||(roles[k]==='sweet'?2:0), wb=look(BRIGHT,ing)||(roles[k]==='bright'?2:0);
    if(ws&&ws>=wb){ sweet+=ws; if(sweetIdx<0) sweetIdx=k; } else if(wb){ bright+=wb; if(brightIdx<0) brightIdx=k; } });
  return {name:d.name, ings:d.ings, note:d.note||'coffee', origin:d.origin||'', added:!!d.added,
          sweet:Math.min(3,sweet), bright:Math.min(3,bright), sweetIdx, brightIdx}; }
let DRINKS=BUILTIN.map(([name,ings,note,origin])=>mk({name,ings,note,origin}));

const CY=432, PITCH=37.5, LX=125;     // wheel centre line, line height 25*150%, text x
let START=Math.max(0,DRINKS.findIndex(d=>d.name==='Cafezinho')); try{ const last=sessionStorage.getItem('bl-last'); const k=DRINKS.findIndex(d=>d.name===last); if(k>=0) START=k; }catch(e){}
// her mask gradient: #E5E5E5 (y 18) -> #5A4235 (y 443) -> #D5D5D5 (y 868)
const G=[[18,[213,213,213]],[443,[90,66,53]],[868,[213,213,213]]], INK=[74,52,40];
const lerp=(a,b,t)=>a+(b-a)*t, clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2, eout=t=>1-Math.pow(1-t,3), ein=t=>t*t*t;
function grad(y){ if(y<=G[0][0])return G[0][1]; if(y>=G[2][0])return G[2][1];
  const k=y<G[1][0]?0:1, t=(y-G[k][0])/(G[k+1][0]-G[k][0]); return G[k][1].map((c,i)=>lerp(c,G[k+1][1][i],t)); }
const rgb=c=>`rgb(${c.map(Math.round).join(',')})`;
const $=id=>document.getElementById(id);
try{ document.fonts.load('24px Cweyons'); document.fonts.load("20px 'Hedvig Letters Sans'"); }catch(e){}

  WORD2 = ADD_I>0 ? D.ings[ADD_I].normalize('NFD').toLowerCase().replace(/[^a-z ]/g,'').trim() : ''; WORD3 = D.brightIdx>0 ? lw(D.ings[D.brightIdx]) : '';
  SUGAR_N = mz ? SUGAR_AT.length : addOnly ? 5 : Math.round(D.sweet/3*SUGAR_AT.length);    // sweeter = more sugar; an add-in floats 5
  LEMON_N = mz ? 8 : D.bright*3;                                             // brighter = more drops to draw
  W_SUGAR = SUGAR_N ? (mz ? {img:$('w_sugar'),w:62.99,h:17.86} : wordImg(WORD2,addOnly?ADDCOL(WORD2):'#FFFFFF',false)) : null;
  W_LEMON = LEMON_N ? (mz ? {img:$('w_lemon'),w:13.82,h:65.82} : wordImg(WORD3,'#F1FF97',true)) : null;
  setCur('none'); scene=7; P.tailT=performance.now();
  { const PP=P; tween(600,t=>{ PP.la=1-t; },null,450); }
  // the timeline glides to where her mug frames have it
  tween(900,t=>{ const e=ease(t); ingsBox.style.transform=`translate(${TL_SHIFT.x*e}px,${TL_SHIFT.y*e}px)`; },null,700);
  tween(700,t=>{ $('mugbox').style.opacity=ease(t); },null,350);
  setTimeout(()=>{ P=null; scene=8; setCur('hold'); },1250);
}

// ---- clicks: decisions only (+ hold on the mug) ----
const TOUCH=matchMedia('(hover:none)').matches; let fingerDown=false;
addEventListener('pointerup',()=>fingerDown=false); addEventListener('pointercancel',()=>fingerDown=false);
addEventListener('pointerdown',e=>{ fingerDown=true;
  if(e.pointerType!=='mouse'){ mx=(e.clientX-OX)/S; my=(e.clientY-OY)/S; }
  if(scene===3){ const h=hitName(); if(h<0) return; pick(h); }
  else if(scene===8&&mugStep===0){ holding=true; }
  else if(scene===9&&finT&&curState==='restart'){ try{ sessionStorage.setItem('bl-last',DRINKS[chosenI].name); }catch(err){} location.reload(); }
  
});

// ---- add a drink you found: type it, the wheel searches as you type; Enter looks it up and adds it for everyone ----
let typed='', typing=false, looking=false, db=null, sample=null;
const hint=$('addhint'), qEl=$('q');
function say(t){ hint.textContent=t; }
function findMatch(t){ const q=norm(t); if(!q) return -1; let pre=-1; for(let i=0;i<DRINKS.length;i++){ const n=norm(DRINKS[i].name); if(n===q) return i; if(pre<0&&n.startsWith(q)) pre=i; } return pre; }
function updTyped(){ typed=qEl.value; if(typeof phShow==='function') phShow(); typing=typed.trim().length>0;
  const m=findMatch(typed); if(m>=0) target=scroll+wrapD(m-scroll);
  if(!looking) say(typing ? (m>=0&&norm(DRINKS[m].name)===norm(typed) ? 'press enter to brew it' : m>=0 ? '' : 'not in the dictionary yet, press enter to add it') : ''); }
qEl.addEventListener('input',updTyped);
// the line types to itself until someone types: her sentence, then a few drinks that are NOT on the wheel yet
const PH=$('ph'), PHT=$('pht'), LINES=['Scroll to browse drinks or type to search','Flat White','Yuanyang','Dirty Chai','Horchata Latte','any drink from any menu'];
let phI=0, phTimer=null;
function phShow(){ PH.classList.toggle('hide', qEl.value.length>0); }
async function phLoop(){ const wait=ms=>new Promise(r=>phTimer=setTimeout(r,ms));
  if(matchMedia('(prefers-reduced-motion: reduce)').matches){ PHT.textContent=LINES[0]; return; }
  while(true){ const t=LINES[phI]; PH.classList.add('typing');
    for(let k=PHT.textContent.length?PHT.textContent.length:0;k<=t.length;k++){ if(PHT.textContent!==t.slice(0,k)) PHT.textContent=t.slice(0,k); await wait(phI===0&&k===0?0:55+Math.random()*50); }
    PH.classList.remove('typing'); await wait(phI===0?3200:1500);
    PH.classList.add('typing'); for(let k=t.length;k>=0;k--){ PHT.textContent=t.slice(0,k); await wait(28); }
    PH.classList.remove('typing'); await wait(350); phI=(phI+1)%LINES.length; } }
PHT.textContent=LINES[0]; setTimeout(phLoop,2600);
qEl.addEventListener('input',phShow);
qEl.addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); if(scene===3&&!looking&&qEl.value.trim()) submitTyped(); }
  else if(e.key==='Escape'){ qEl.value=''; updTyped(); qEl.blur(); } });
addEventListener('keydown',e=>{ if(scene!==3||looking||document.activeElement===qEl||e.metaKey||e.ctrlKey||e.altKey) return; if(e.key.length===1) qEl.focus(); });
function prompt(name){ return `You are adding one entry to a dictionary of café drinks. Someone found this drink on a menu: ${JSON.stringify(name)}
Return JSON only, in exactly this shape:
{"name": the proper spelling in Title Case, at most 28 characters,
 "ingredients": 2 to 5 items in the order the drink is made, base first, each {"name": short Title Case ingredient, "role": "base" | "sweet" | "bright" | "other"},
 "note": one lowercase taste word, like "citrusy", "nutty", "smoky", "creamy",
 "origin": one plain sentence of at most 14 words on where the name comes from or what it means,
 "known": true or false}
Roles: sweet = sugar, syrup, honey, condensed milk, chocolate or another sweetener. bright = citrus, sour, floral or fizzy. base = the coffee or tea itself. other = everything else.
If it is probably one café's own invented name, set "known": false, start "origin" with "Probably a café's own name." and give your best guess. Never invent a history.
If it is not a drink at all, return {"not_a_drink": true}.`; }
async function submitTyped(){
  const name=qEl.value.trim(), m=findMatch(name);
  if(m>=0 && norm(DRINKS[m].name)===norm(name)){ pick(m); return; }
  if(!sample){ say('adding new drinks only works inside Claude'); return; }
  looking=true; qEl.readOnly=true; qEl.classList.add('looking'); say('looking it up');
  try{
    const r=await sample.json(prompt(name),{modelTier:'quick'});
    if(!r||r.not_a_drink||!Array.isArray(r.ingredients)||!r.ingredients.length){ looking=false; qEl.readOnly=false; qEl.classList.remove('looking'); say('that doesn’t look like a drink'); return; }
    const ingr=r.ingredients.slice(0,5).map(x=>({name:String(x.name||'').slice(0,24),role:String(x.role||'other')})).filter(x=>x.name);
    const rec={name:String(r.name||name).slice(0,28), ings:ingr.map(x=>x.name), roles:ingr.map(x=>x.role),
      note:String(r.note||'coffee').toLowerCase().replace(/[^a-z]/g,'').slice(0,14)||'coffee', origin:String(r.origin||'').slice(0,140), known:r.known!==false, addedAt:Date.now()};
    const i=addDrink(rec, true);
    if(db){ try{ await db.collection('drinks').add(rec); }catch(err){ say(err&&err.code==='quota_exceeded'?'the dictionary is full':'added on this screen only'); } }
    looking=false; qEl.readOnly=false; qEl.classList.remove('looking'); if(!db) say('added on this screen only');
    pick(i);
  }catch(err){ looking=false; qEl.readOnly=false; qEl.classList.remove('looking');
    say(err&&err.code==='not_granted'?'adding new drinks is switched off':err&&err.code==='rate_limited'?'too many at once, try again in a moment':'the lookup didn’t come back, press enter to try again'); }
}
function addDrink(rec, centre){ const k=findMatch(rec.name); if(k>=0&&norm(DRINKS[k].name)===norm(rec.name)) return k;
  const at = centre ? (((Math.round(scroll)%DRINKS.length)+DRINKS.length)%DRINKS.length)+1 : DRINKS.length;
  DRINKS.splice(at,0,mk({...rec,added:true})); if(centre){ scroll=at-1+ (scroll-Math.round(scroll)); target=scroll; }
  buildItems(); return at; }
let pendingAdds=[];
(async()=>{ if(!window.claude||!claude.use) return;
  [db,sample]=await Promise.all([claude.use('db'),claude.use('sample')]);
  if(!db) return;
  db.collection('drinks').orderBy('addedAt').onSnapshot(s=>{ for(const d of s.docs){ const v=d.data(); if(!v||!v.name||!Array.isArray(v.ings)) continue;
      const rec={name:String(v.name).slice(0,28),ings:v.ings.map(String).slice(0,5),roles:Array.isArray(v.roles)?v.roles.map(String):[],note:String(v.note||'coffee'),origin:String(v.origin||'')};
      if(findMatch(rec.name)>=0&&norm(DRINKS[findMatch(rec.name)].name)===norm(rec.name)) continue;
      if(scene===3&&!looking) addDrink(rec,false); else pendingAdds.push(rec); } },()=>{});
})();
function pick(h){ target=scroll+wrapD(h-scroll); const wait=Math.abs(target-scroll)>.05?320:0; scene=3.5; setTimeout(()=>brew(h),wait); }

// ---- frame loop ----
let last=performance.now();
function frame(now){ const dt=Math.min(50,now-last); last=now; runTweens(now);
  // wheel physics
  if(scene>=3 && scene<6){
    if(scene===3 && now-snapT>140) target=Math.round(target);
    scroll=lerp(scroll,target,1-Math.pow(.0001,dt/1000*1.4*(scene===3.5?2:1)));
    const h=hitName();
    if(h!==hovered){ hovered=h; }
    for(const it of items){ const want=(it.i===hovered)?1:0; const s=dt/1000; it.hv+=(40*(want-it.hov)-12.6*it.hv)*s; it.hov+=it.hv*s; }
    if(scene===3){ setCur(hovered>=0?'brew':'arrow'); if(pendingAdds.length&&!looking){ pendingAdds.splice(0).forEach(r=>addDrink(r,false)); } }
    wheelDT=Math.min(.033,dt/1000); if(scene<6) drawWheel();
  }
  drawLens(dt);
  // cursor + buzz on touching a name
  let bx=0,by=0; const b=now-buzz; if(b<170){ const a=(1-b/170)*1.8; bx=(Math.random()*2-1)*a; by=(Math.random()*2-1)*a; }
  if(scene===6||scene===7) drawPour(now);
  if(scene===8||scene===9) stepMug(now,dt);
  if(scene===9&&finT){ const inMugArea=mx>LIQ.x-30&&mx<LIQ.x+LIQ.w+30&&my>LIQ.y-30&&my<LIQ.y+LIQ.h+30; setCur(inMugArea?'find':'restart'); }
  const HS={hold:[23,21],tilt:[17,14],brewcup:[17,14],shake:[10,34],drip:[11,11.5],restart:[17,17]}, hs=HS[curState]||[HOT,HOT], hx=hs[0], hy=hs[1];
  let cx_=mx, cy_=my;
  if(TOUCH){ $('cur').style.opacity=(scene<8)?0:1;   // the wheel needs no cursor on a phone
    if(!fingerDown && scene>=8 && curState!=='find' && curState!=='restart'){ cx_=LIQ.x+LIQ.w/2; cy_=LIQ.y-70; } }
  $('cur').style.transform=`translate(${cx_-hx+bx}px,${cy_-hy+by}px)`+(TOUCH?' scale(1.7)':'');
  requestAnimationFrame(frame); }
setCur('arrow'); scroll=START+6; target=START; tween(1100,t=>{ wheelIn=eout(t); },null,250);
requestAnimationFrame(frame);
window.__dbg=()=>[Px,Py,amp,svx,Cx,mx].map(v=>+v.toFixed(1));window.__seq={get scene(){return scene},get st(){return {mugStep,fill,holding,drops:drops.length,nSugar,nLemon,tint}}};
</script>
